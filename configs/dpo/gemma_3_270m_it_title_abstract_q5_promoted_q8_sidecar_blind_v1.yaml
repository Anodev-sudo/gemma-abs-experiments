model: "google/gemma-3-270m-it"
model_path: null
hf_home: "hf_bucket/experiments/mlx_lora/.hf-home"
model_dtype: "float32"

# Preference-only pass from the promoted q8 adapter converted to PEFT, evaluated
# through the q5 llama.cpp sidecar path. The dataset uses existing q8 and q5
# sidecar outputs chosen by blind review; it does not introduce new written
# target labels.
converted_adapter_dir: "hf_bucket/experiments/sft/q5_promoted_q8_adapter_sidecar_probe_v1"
dataset_dir: "hf_bucket/experiments/sft/q5_promoted_q8_adapter_sidecar_probe_v1/dpo_blind_q8_vs_sidecar_v1/dataset"
output_dir: "hf_bucket/experiments/sft/q5_promoted_q8_adapter_sidecar_probe_v1/dpo_blind_q8_vs_sidecar_v1/lr7e7_beta01"

seed: 20260518

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 1
learning_rate: 7.0e-7
beta: 0.1
loss_type: "sigmoid"
warmup_ratio: 0.08
max_prompt_length: 1024
max_length: 1088

logging_steps: 5
eval_strategy: "no"
skip_final_eval: true
eval_steps: 25
save_strategy: "steps"
save_steps: 25
save_total_limit: 6
max_grad_norm: 1.0
dataloader_num_workers: 0
disable_dropout: true
report_to: []
copy_config_into_output: true
