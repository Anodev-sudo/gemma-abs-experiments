model: "google/gemma-3-270m-it"
model_path: null
hf_home: "hf_bucket/experiments/mlx_lora/.hf-home"
model_dtype: "float32"

# Diagnostic preference-only pass from the promoted q5/q8 sidecar.
# The dataset contains existing curated preference labels; this run does not
# create or train on new assistant-written target text.
converted_adapter_dir: "hf_bucket/experiments/sft/q5_promoted_q8_adapter_sidecar_probe_v1"
dataset_dir: "hf_dataset/releases/recent_3y_balanced_5000_pilot_v2/dpo/title_abstract_preference_balanced200_curated_v2"
output_dir: "hf_bucket/experiments/sft/q5_promoted_q8_sidecar_curated200_dpo_v1/lr2e6_beta01_steps80"

seed: 20260527

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 2
learning_rate: 2.0e-6
beta: 0.1
loss_type: "sigmoid"
warmup_ratio: 0.08
max_prompt_length: 1024
max_length: 1088

logging_steps: 5
eval_strategy: "no"
skip_final_eval: true
eval_steps: 20
save_strategy: "steps"
save_steps: 20
save_total_limit: 6
max_grad_norm: 1.0
dataloader_num_workers: 0
disable_dropout: true
report_to: []
copy_config_into_output: true
