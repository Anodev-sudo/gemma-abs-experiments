model: "google/gemma-3-270m-it"
model_path: null
hf_home: "hf_bucket/experiments/mlx_lora/.hf-home"
model_dtype: "float32"

# Second-stage patch from the first numeric checkpoint that fixed both stress cases.
converted_adapter_dir: "hf_bucket/experiments/sft/q5_step2400_sft700_numeric_role_curriculum_v1/checkpoint-175"
dataset_path: "hf_bucket/experiments/sft/q5_step2400_sft700_numeric_compression_v1/dataset_over13_v1/train.jsonl"
output_dir: "hf_bucket/experiments/sft/q5_step2400_sft700_numeric_compression_v1"

seed: 20260515

# Compression-only counterpatch: checkpoint-175 overlong outputs back to existing concise labels.
# Keep LR low so we reduce verbosity without erasing numeric-role gains.
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 2
learning_rate: 2.0e-7
warmup_ratio: 0.05
max_seq_length: 1088
assistant_only_loss: true
gradient_checkpointing: false

logging_steps: 1
save_strategy: "steps"
save_steps: 20
save_total_limit: 10
max_grad_norm: 1.0
dataloader_num_workers: 0
report_to: []
copy_config_into_output: true
