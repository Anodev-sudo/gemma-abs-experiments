model: "google/gemma-3-270m-it"
model_path: null
hf_home: "hf_bucket/experiments/mlx_lora/.hf-home"
model_dtype: "float32"

# Continue from the promoted q5 SFT correction candidate.
converted_adapter_dir: "hf_bucket/experiments/sft/q5_step2400_sft_correction_v1/checkpoint-700"
dataset_path: "hf_bucket/experiments/sft/q5_step2400_sft700_targeted_only_v2/dataset/train.jsonl"
output_dir: "hf_bucket/experiments/sft/q5_step2400_sft700_targeted_only_v2"

seed: 20260512

# Sharper v2 patch: assistant-only loss, no stabilizers, higher LR, two passes.
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 2
learning_rate: 8.0e-7
warmup_ratio: 0.05
max_seq_length: 1088
assistant_only_loss: true
gradient_checkpointing: false

logging_steps: 1
save_strategy: "steps"
save_steps: 25
save_total_limit: 12
max_grad_norm: 1.0
dataloader_num_workers: 0
report_to: []
copy_config_into_output: true
