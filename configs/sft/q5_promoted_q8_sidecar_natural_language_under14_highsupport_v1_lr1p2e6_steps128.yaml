# clean 1648-row stabilizer and adds only filtered non-base rows from the q8
# under-14 repair dataset at low weight.
converted_adapter_dir: "hf_bucket/experiments/sft/q5_promoted_q8_adapter_sidecar_probe_v1"
dataset_path: "hf_bucket/experiments/sft/q5_promoted_q8_sidecar_natural_language_under14_highsupport_v1/dataset_clean1648_under14_highsupport_v1/train.jsonl"
output_dir: "hf_bucket/experiments/sft/q5_promoted_q8_sidecar_natural_language_under14_highsupport_v1/lr1p2e6_steps128"

seed: 20260604

per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 1
max_steps: 128
learning_rate: 1.2e-6
warmup_ratio: 0.05
max_seq_length: 1088
weighted_loss_normalization: "label_count"
gradient_checkpointing: false

logging_steps: 5
save_strategy: "steps"
