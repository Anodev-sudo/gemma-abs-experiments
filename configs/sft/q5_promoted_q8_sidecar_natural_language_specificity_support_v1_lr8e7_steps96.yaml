converted_adapter_dir: "hf_bucket/experiments/sft/q5_promoted_q8_adapter_sidecar_probe_v1"
dataset_path: "hf_bucket/experiments/sft/q5_promoted_q8_sidecar_natural_language_specificity_support_v1/dataset_clean1648_broadsupport_v1/train.jsonl"
output_dir: "hf_bucket/experiments/sft/q5_promoted_q8_sidecar_natural_language_specificity_support_v1/lr8e7_steps96"

seed: 20260603

per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 1
max_steps: 96
learning_rate: 8.0e-7
warmup_ratio: 0.05
max_seq_length: 1088
weighted_loss_normalization: "label_count"
gradient_checkpointing: false

logging_steps: 5
save_strategy: "steps"
