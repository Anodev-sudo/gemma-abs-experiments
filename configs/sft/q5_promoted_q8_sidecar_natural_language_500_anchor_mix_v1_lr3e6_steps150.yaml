model: "google/gemma-3-270m-it"
model_path: null
hf_home: "hf_bucket/experiments/mlx_lora/.hf-home"
model_dtype: "float32"

# Three-step creep from the no-anchor 3e-6 diagnostic: keep the same LR, add
# low-weight faithfulness replay anchors, and run longer so the NL rows still
# get enough update pressure.
converted_adapter_dir: "hf_bucket/experiments/sft/q5_promoted_q8_adapter_sidecar_probe_v1"
dataset_path: "hf_bucket/experiments/sft/q5_promoted_q8_sidecar_natural_language_500_anchor_mix_v1/dataset_500nl_1000faithanchors_w025/train.jsonl"
output_dir: "hf_bucket/experiments/sft/q5_promoted_q8_sidecar_natural_language_500_anchor_mix_v1/lr3e6_steps150"

seed: 20260522

per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 1
max_steps: 150
learning_rate: 3.0e-6
warmup_ratio: 0.05
max_seq_length: 1088
weighted_loss_normalization: "label_count"
gradient_checkpointing: false

logging_steps: 5
save_strategy: "steps"
save_steps: 30
save_total_limit: 8
max_grad_norm: 1.0
dataloader_num_workers: 0
report_to: []
copy_config_into_output: true
