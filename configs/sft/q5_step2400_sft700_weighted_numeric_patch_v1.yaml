model: "google/gemma-3-270m-it"
model_path: null
hf_home: "hf_bucket/experiments/mlx_lora/.hf-home"
model_dtype: "float32"

# Style-stable promoted checkpoint-700 as base.
converted_adapter_dir: "hf_bucket/experiments/sft/q5_step2400_sft_correction_v1/checkpoint-700"
dataset_path: "hf_bucket/experiments/sft/q5_step2400_sft700_weighted_numeric_patch_v1/dataset_75normal_25numeric_v1/train.jsonl"
output_dir: "hf_bucket/experiments/sft/q5_step2400_sft700_weighted_numeric_patch_v1"

seed: 20260515

# Lower than the checkpoint-700 SFT correction LR (5e-7), with weighted numeric tokens.
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_train_epochs: 1
learning_rate: 1.0e-7
warmup_ratio: 0.05
max_seq_length: 1088
weighted_loss_normalization: "label_count"
gradient_checkpointing: false

logging_steps: 1
save_strategy: "steps"
save_steps: 25
save_total_limit: 12
max_grad_norm: 1.0
dataloader_num_workers: 0
report_to: []
copy_config_into_output: true
