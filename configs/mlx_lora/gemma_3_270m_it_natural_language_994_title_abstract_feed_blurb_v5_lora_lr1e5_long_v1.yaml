# MLX LoRA config for a fresh 994-row title+abstract feed-blurb prompt-v5 run.
# Run with:
#   HF_HOME=hf_bucket/experiments/mlx_lora/.hf-home \
#   hf_bucket/experiments/mlx_lora/runtime/py312/bin/python \
#     -m mlx_lm.lora \
#     --config configs/mlx_lora/gemma_3_270m_it_natural_language_994_title_abstract_feed_blurb_v5_lora_lr1e5_long_v1.yaml \
#     --mask-prompt

model: "google/gemma-3-270m-it"

train: true
fine_tune_type: lora
optimizer: adamw

data: "hf_dataset/releases/recent_3y_balanced_20000_natural_language_teacher_deepseek_v4_pro_1000_milestone/mlx_lora/title_abstract_chat_gemma_270m_it_abstract_to_feed_blurb_v5"

seed: 20260527

# Tune all transformer blocks.
num_layers: -1

# Matched to prompt-v2/v3/v4 title+abstract runs so the prompt contract is the
# main intentional variable.
batch_size: 4
iters: 500

val_batches: -1
learning_rate: 1e-5
steps_per_report: 10
steps_per_eval: 25
grad_accumulation_steps: 1

resume_adapter_file: null
adapter_path: "hf_bucket/experiments/mlx_lora/gemma_3_270m_it_natural_language_994_title_abstract_feed_blurb_v5_lora_lr1e5_long_v1/adapters"
save_every: 25

test: true
test_batches: -1

max_seq_length: 1024
grad_checkpoint: false

lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
  rank: 16
  scale: 10.0
  dropout: 0.0
