# Continue Granite strict-support v1 from the first-leg checkpoint 1000.
# The checkpoint numbers in this output directory are continuation-local:
# `0000600_adapters.safetensors` corresponds to global step 1600.

model: "ibm-granite/granite-4.0-350m"

train: true
fine_tune_type: lora
optimizer: adamw

data: "hf_bucket/experiments/mlx_lora/granite_4_0_350m_natural_language_994_gold8_strict10746_support_v1/dataset_gold8_strictsupport1600_feed_blurb_v5"

seed: 20260527

num_layers: -1

batch_size: 4
iters: 600

val_batches: -1
learning_rate: 5e-6
steps_per_report: 10
steps_per_eval: 100
grad_accumulation_steps: 1

resume_adapter_file: "hf_bucket/experiments/mlx_lora/granite_4_0_350m_natural_language_994_gold8_strict10746_support_v1/adapters_lr5e6/0001000_adapters.safetensors"
adapter_path: "hf_bucket/experiments/mlx_lora/granite_4_0_350m_natural_language_994_gold8_strict10746_support_v1/adapters_lr5e6_resume1000_to1600"
save_every: 100

test: true
test_batches: -1

max_seq_length: 1024
grad_checkpoint: false

lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
  rank: 16
  scale: 10.0
  dropout: 0.0
