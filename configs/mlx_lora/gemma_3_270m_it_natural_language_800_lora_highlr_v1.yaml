# MLX LoRA config for a fresh 800-row natural-language summary run.
# Run with:
#   HF_HOME=hf_bucket/experiments/mlx_lora/.hf-home \
#   hf_bucket/experiments/mlx_lora/runtime/py312/bin/python \
#     -m mlx_lm.lora \
#     --config configs/mlx_lora/gemma_3_270m_it_natural_language_800_lora_highlr_v1.yaml \
#     --mask-prompt

model: "google/gemma-3-270m-it"

train: true
fine_tune_type: lora
optimizer: adamw

data: "hf_dataset/releases/recent_3y_balanced_20000_natural_language_teacher_deepseek_v4_pro_800_milestone/mlx_lora/abstract_only_chat_gemma_270m_it_abstract_to_natural_language_summary_v1"

seed: 20260526

# Tune all transformer blocks.
num_layers: -1

# 720 train rows at batch 4 makes 360 steps exactly two passes. The higher
# learning rate should show whether the larger gold set can move style quickly.
batch_size: 4
iters: 360

val_batches: -1
learning_rate: 1e-5
steps_per_report: 10
steps_per_eval: 20
grad_accumulation_steps: 1

resume_adapter_file: null
adapter_path: "hf_bucket/experiments/mlx_lora/gemma_3_270m_it_natural_language_800_lora_highlr_v1/adapters"
save_every: 20

test: true
test_batches: -1

max_seq_length: 1024
grad_checkpoint: false

lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
  rank: 16
  scale: 10.0
  dropout: 0.0
