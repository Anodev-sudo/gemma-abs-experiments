# Stage A: train Granite 4.0 350M LoRA directly on a clean q6 MLX base.
# Run with:
#   HF_HOME=hf_bucket/experiments/mlx_lora/.hf-home \
#   hf_bucket/experiments/mlx_lora/runtime/py312/bin/python \
#     -m mlx_lm lora \
#     --config configs/mlx_lora/granite_4_0_350m_v5_q6_fusion_aware_stage_a_lr5e6.yaml \
#     --mask-prompt

model: "hf_bucket/experiments/mlx_lora/granite_4_0_350m_v5_q6_fusion_aware_v1/base_q6_g64"

train: true
fine_tune_type: lora
optimizer: adamw

data: "hf_dataset/releases/recent_3y_balanced_20000_natural_language_teacher_deepseek_v4_pro_1000_milestone/mlx_lora/title_abstract_chat_gemma_270m_it_abstract_to_feed_blurb_v5"

seed: 20260527

num_layers: -1

batch_size: 4
iters: 500

val_batches: -1
learning_rate: 5e-6
steps_per_report: 10
steps_per_eval: 25
grad_accumulation_steps: 1

resume_adapter_file: null
adapter_path: "hf_bucket/experiments/mlx_lora/granite_4_0_350m_v5_q6_fusion_aware_v1/stage_a_q6_base_lr5e6/adapters"
save_every: 25

test: true
test_batches: -1

max_seq_length: 1024
grad_checkpoint: false

lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
  rank: 16
  scale: 10.0
  dropout: 0.0
