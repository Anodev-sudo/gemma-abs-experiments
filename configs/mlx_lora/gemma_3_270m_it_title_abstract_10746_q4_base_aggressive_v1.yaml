# MLX LoRA config for retraining Gemma 3 270M IT from a raw q4 MLX base on
# the merged 10,746-row title+abstract release.
# Run with:
#   hf_bucket/experiments/mlx_lora/runtime/py312/bin/python \
#     -m mlx_lm.lora \
#     --config configs/mlx_lora/gemma_3_270m_it_title_abstract_10746_q4_base_aggressive_v1.yaml \
#     --mask-prompt

model: "hf_bucket/experiments/mlx_lora/quantized_models/google_gemma_3_270m_it/q4_g64"
train: true
fine_tune_type: lora
optimizer: adamw

# Merged 10,746-row release converted into MLX chat format with title+abstract
# prompts.
data: "hf_dataset/releases/recent_3y_balanced_10746_v1/mlx_lora/title_abstract_chat_gemma_270m_it_abstract_to_glanceable_summary_v1"

seed: 20260417
num_layers: -1

batch_size: 4
iters: 3600
val_batches: -1

learning_rate: 1.5e-5
steps_per_report: 10
steps_per_eval: 200
grad_accumulation_steps: 2

resume_adapter_file: null

adapter_path: "hf_bucket/experiments/mlx_lora/gemma_3_270m_it_title_abstract_10746_q4_base_aggressive_v1/adapters"
save_every: 200
test: true
test_batches: -1
max_seq_length: 1024

grad_checkpoint: true

lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
  rank: 16
  scale: 10.0
  dropout: 0.0

