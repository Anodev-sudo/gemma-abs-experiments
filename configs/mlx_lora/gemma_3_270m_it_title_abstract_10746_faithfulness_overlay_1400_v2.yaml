# MLX LoRA config for the 1,400-row faithfulness/specificity overlay v2.
# This starts from the readable base-aggressive v1 endpoint and trains only on
# the correction overlay, not the full 10.7k release.
# Run with:
#   hf_bucket/experiments/mlx_lora/runtime/py312/bin/python \
#     -m mlx_lm.lora \
#     --config configs/mlx_lora/gemma_3_270m_it_title_abstract_10746_faithfulness_overlay_1400_v2.yaml \
#     --mask-prompt

model: "google/gemma-3-270m-it"
train: true
fine_tune_type: lora
optimizer: adamw

data: "hf_dataset/releases/recent_3y_balanced_10746_faithfulness_overlay_1400_v2/mlx_lora/title_abstract_chat_gemma_270m_it_abstract_to_glanceable_summary_v1"

seed: 20260427
num_layers: -1

batch_size: 4
iters: 600
val_batches: -1

learning_rate: 5e-6
steps_per_report: 10
steps_per_eval: 50
grad_accumulation_steps: 2

resume_adapter_file: "hf_bucket/experiments/mlx_lora/gemma_3_270m_it_title_abstract_10746_from_base_aggressive_v1/adapters/0003600_adapters.safetensors"

adapter_path: "hf_bucket/experiments/mlx_lora/gemma_3_270m_it_title_abstract_10746_faithfulness_overlay_1400_v2/adapters"
save_every: 50
test: true
test_batches: -1
max_seq_length: 1024

grad_checkpoint: true

lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
  rank: 16
  scale: 10.0
  dropout: 0.0
