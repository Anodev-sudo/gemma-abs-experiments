# Numeric-clean strict-gold finishing pass resumed from the heuristic-3000
# burn-in. This branch tests whether the broad phase becomes useful when the
# gold finisher stops rewarding numeric/formula target rows.
# Run with:
#   HF_HOME=hf_bucket/experiments/mlx_lora/.hf-home \
#   hf_bucket/experiments/mlx_lora/runtime/py312/bin/python \
#     -m mlx_lm.lora \
#     --config configs/mlx_lora/gemma_3_270m_it_natural_language_10746_heuristic3000_goldclean_finish_v1_lr1e5.yaml \
#     --mask-prompt

model: "google/gemma-3-270m-it"

train: true
fine_tune_type: lora
optimizer: adamw

data: "hf_bucket/experiments/mlx_lora/gemma_3_270m_it_natural_language_10746_heuristic3000_goldfinish_v1/dataset_gold_digitformula_free_feed_blurb_v5"

seed: 20260527
num_layers: -1

batch_size: 4
iters: 225

val_batches: -1
learning_rate: 1e-5
steps_per_report: 10
steps_per_eval: 25
grad_accumulation_steps: 1

resume_adapter_file: "hf_bucket/experiments/mlx_lora/gemma_3_270m_it_natural_language_10746_heuristic3000_goldfinish_v1/burnin_lr8e6/0000800_adapters.safetensors"
adapter_path: "hf_bucket/experiments/mlx_lora/gemma_3_270m_it_natural_language_10746_heuristic3000_goldfinish_v1/goldclean_finish_lr1e5"
save_every: 25

test: true
test_batches: -1

max_seq_length: 1024
grad_checkpoint: false

lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
  rank: 16
  scale: 10.0
  dropout: 0.0
