# MLX LoRA config for a naive first-phase pass resumed from the current q5
# candidate adapter.

model: "hf_bucket/experiments/mlx_lora/quantized_models/google_gemma_3_270m_it/q4_g64"
train: true
fine_tune_type: lora
optimizer: adamw

data: "hf_dataset/releases/recent_3y_balanced_10746_v1/mlx_lora/title_abstract_chat_gemma_270m_it_abstract_to_glanceable_summary_v1"

seed: 20260507
num_layers: -1

batch_size: 4
iters: 3600
val_batches: -1

learning_rate: 1.5e-5
steps_per_report: 10
steps_per_eval: 200
grad_accumulation_steps: 2

resume_adapter_file: "hf_bucket/experiments/mlx_lora/gemma_3_270m_it_title_abstract_10746_q4_hardening_combined_v1_lr_1e_6/adapters/0000300_adapters.safetensors"

