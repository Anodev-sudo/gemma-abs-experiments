# Curriculum STAGE 1 — grounding pretrain.
# MLP-LoRA on ~10.2k summaries rendered under the BRIEF prompt (grounding built in
# the inference mode). Stage 2 resumes this adapter and drills brief voice on the 994.
model: "quant_probe/stripped_base_df100"
train: true
test: true
data: "training/data/curriculum_stage1_granitebrief_v1"

fine_tune_type: lora
num_layers: -1
lora_parameters:
  keys: ["self_attn.q_proj","self_attn.k_proj","self_attn.v_proj","self_attn.o_proj","mlp.gate_proj","mlp.up_proj","mlp.down_proj"]
  rank: 16
  scale: 10.0
  dropout: 0.05

batch_size: 4
iters: 2000
max_seq_length: 1024
mask_prompt: true
learning_rate: 1.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 100
  warmup_init: 1.0e-7
  arguments: [1.0e-5, 2000, 1.0e-6]
save_every: 200
steps_per_eval: 200
steps_per_report: 25
val_batches: -1
test_batches: -1
seed: 20260613
adapter_path: "training/runs/gemma_v5_curriculum_df100_briefground_v1/stage1/adapters"
