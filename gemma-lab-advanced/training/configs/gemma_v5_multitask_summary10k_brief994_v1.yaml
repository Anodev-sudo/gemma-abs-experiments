# gemma-3-270m-it dual-prompt MULTI-TASK LoRA SFT.
#
# Hypothesis: gemma already has brief *style*; it lacks *grounding*. Teach grounding
# from the wide ~10k summary DB behind a 'summary' system prompt, keep brief *voice*
# bound to the brief system prompt (used at inference). Style is separated into a
# label, not blended. Builds on the round-2 MLP recipe (attn+MLP LoRA), which already
# improved faithfulness on briefs alone.
#
# Data: training/data/multitask_summary10k_brief994_v1
#   train: 12,875 (10,193 summary-mode + 2,682 brief-mode = 894 x3 upsample)
#   valid/test: 50/50 BRIEF-mode only (track brief performance)
#   994 brief train/valid/test papers excluded from the summary side (no leakage).

model: "google/gemma-3-270m-it"
train: true
test: true
data: "training/data/multitask_summary10k_brief994_v1"

fine_tune_type: lora
num_layers: -1
lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
    - "mlp.gate_proj"
    - "mlp.up_proj"
    - "mlp.down_proj"
  rank: 16
  scale: 10.0
  dropout: 0.05

batch_size: 4
iters: 2400              # <1 epoch over 12.9k rows; avoids memorizing summaries
max_seq_length: 1024
mask_prompt: true

learning_rate: 1.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 100
  warmup_init: 1.0e-7
  arguments: [1.0e-5, 2400, 1.0e-6]

save_every: 100
steps_per_eval: 100
steps_per_report: 20
val_batches: -1
test_batches: -1

seed: 20260613
adapter_path: "training/runs/gemma_v5_multitask_summary10k_brief994_v1/adapters"
