# FULL fine-tune variant of the DF>=100 recovery curriculum — STAGE 1 grounding.
# Same data/schedule as recovery_df100_stage1; only fine_tune_type changes (lora -> full).
# Tests whether full FT of the transformer beats rank-16 LoRA at 270M scale.
model: "quant_probe/stripped_base_df100"
train: true
test: true
data: "training/data/curriculum_stage1_summaries_briefprompt_v1"

fine_tune_type: full
num_layers: -1

batch_size: 4
iters: 2000
max_seq_length: 1024
mask_prompt: true
learning_rate: 1.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 100
  warmup_init: 1.0e-7
  arguments: [1.0e-5, 2000, 1.0e-6]
save_every: 200
steps_per_eval: 200
steps_per_report: 25
val_batches: -1
test_batches: -1
seed: 20260613
adapter_path: "training/runs/gemma_v5_df100_fullft_v1/stage1/adapters"
