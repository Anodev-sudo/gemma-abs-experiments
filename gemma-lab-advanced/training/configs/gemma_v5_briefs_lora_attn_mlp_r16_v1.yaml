# gemma-3-270m-it LoRA SFT on the v5 briefs gold set.
#
# Controlled repeat of the shipped run's failure-shape test: SAME data
# (v5 894/50/50), recipe matched to the shipped adapter EXCEPT the LoRA target
# modules are expanded from attention-only (q/k/v/o) to attention + MLP
# (adds gate/up/down). Round-1's diagnosis: gemma learns brief *shape* but not
# *grounding*; factual associations live mostly in the MLP blocks the prior
# adapter never adapted. Mild dropout + cosine decay guard the overfit that made
# the shipped run's ckpt500 worse than ckpt425.
#
# Target deployment runtime is MLX-Swift; we train here in Python MLX.

model: "google/gemma-3-270m-it"
train: true
test: true

data: "gold_pipeline/05_milestone_assembly/gold_set/mlx_lora/title_abstract_chat_gemma_270m_it_abstract_to_feed_blurb_v5"

fine_tune_type: lora
num_layers: -1            # all transformer layers

# --- the deliberate change vs the shipped run ---
lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
    - "mlp.gate_proj"
    - "mlp.up_proj"
    - "mlp.down_proj"
  rank: 16
  scale: 10.0
  dropout: 0.05

# --- held to the shipped run ---
batch_size: 4
iters: 600
max_seq_length: 1024
mask_prompt: true

# cosine decay with short warmup (shipped run used a flat 1e-5)
learning_rate: 1.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1.0e-7
  arguments: [1.0e-5, 600, 1.0e-6]

# checkpoint often; we pick by test-set generation quality, not val loss
save_every: 25
steps_per_eval: 25
steps_per_report: 10
val_batches: -1
test_batches: -1

seed: 20260613
adapter_path: "training/runs/gemma_v5_briefs_lora_attn_mlp_r16_v1/adapters"
