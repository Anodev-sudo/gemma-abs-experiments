# Curriculum STAGE 1 — faithfulness-first brief grounding.
# MLP+attn LoRA on the 5,182 regenerated, strict-verify-gated faithful briefs (data audited
# at 2.92/3 faithful). Variant A ("faithful-only") fuses straight from THIS adapter, no voice stage.
model: "quant_probe/stripped_base_df100"
train: true
test: true
data: "training/data/curriculum_stage1_gemma4xl_faithful_v1"

fine_tune_type: lora
num_layers: -1
lora_parameters:
  keys: ["self_attn.q_proj","self_attn.k_proj","self_attn.v_proj","self_attn.o_proj","mlp.gate_proj","mlp.up_proj","mlp.down_proj"]
  rank: 16
  scale: 10.0
  dropout: 0.05

batch_size: 4
iters: 2000
max_seq_length: 1024
mask_prompt: true
learning_rate: 1.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 100
  warmup_init: 1.0e-7
  arguments: [1.0e-5, 2000, 1.0e-6]
save_every: 200
steps_per_eval: 200
steps_per_report: 25
val_batches: -1
test_batches: -1
seed: 20260616
adapter_path: "training/runs/gemma_v5_curriculum_df100_faithful_v1/stage1/adapters"
