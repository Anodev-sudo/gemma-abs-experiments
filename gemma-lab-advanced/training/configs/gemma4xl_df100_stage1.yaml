# Curriculum STAGE 1 — brief-OBJECTIVE grounding pretrain.
# MLP+attn LoRA on the gemma-4-26b teacher's faithfulness-verified briefs (prompt-only,
# few-shot voice). This replaces the old summary-grounding: the grounding targets are now
# real BRIEFS (objective-correct), not summaries rendered under a brief prompt.
# Stage 2 resumes this adapter and drills voice on the 894 gold.
model: "quant_probe/stripped_base_df100"
train: true
test: true
data: "training/data/curriculum_stage1_gemma4xl_briefground_v1"

fine_tune_type: lora
num_layers: -1
lora_parameters:
  keys: ["self_attn.q_proj","self_attn.k_proj","self_attn.v_proj","self_attn.o_proj","mlp.gate_proj","mlp.up_proj","mlp.down_proj"]
  rank: 16
  scale: 10.0
  dropout: 0.05

batch_size: 4
iters: 2000
max_seq_length: 1024
mask_prompt: true
learning_rate: 1.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 100
  warmup_init: 1.0e-7
  arguments: [1.0e-5, 2000, 1.0e-6]
save_every: 200
steps_per_eval: 200
steps_per_report: 25
val_batches: -1
test_batches: -1
seed: 20260615
adapter_path: "training/runs/gemma_v5_curriculum_df100_gemma4xl_v1/stage1/adapters"
