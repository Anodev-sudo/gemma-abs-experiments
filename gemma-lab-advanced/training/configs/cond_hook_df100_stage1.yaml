# Curriculum STAGE 1 — CONDITIONAL subject-fronting hook (cond_hook_v1).
# IDENTICAL recipe to faithful_df100_stage1.yaml (size-controlled vs the incumbent faithful_only_q5):
# same base, same attn+MLP r16 LoRA, same 2000 iters / LR schedule. The ONLY delta is the data —
# the 5,182 targets are surface-form relabeled to front a GROUNDED specific subject when the
# abstract supports one, else keep the generic hedge. Variant "cond_hook" fuses straight from THIS
# adapter, no voice stage (consistent with faithful_only "ship grounding-only").
model: "quant_probe/stripped_base_df100"
train: true
test: true
data: "training/data/curriculum_stage1_gemma4xl_cond_hook_v1"

fine_tune_type: lora
num_layers: -1
lora_parameters:
  keys: ["self_attn.q_proj","self_attn.k_proj","self_attn.v_proj","self_attn.o_proj","mlp.gate_proj","mlp.up_proj","mlp.down_proj"]
  rank: 16
  scale: 10.0
  dropout: 0.05

batch_size: 4
iters: 2000
max_seq_length: 1024
mask_prompt: true
learning_rate: 1.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 100
  warmup_init: 1.0e-7
  arguments: [1.0e-5, 2000, 1.0e-6]
save_every: 200
steps_per_eval: 200
steps_per_report: 25
val_batches: -1
test_batches: -1
seed: 20260617
adapter_path: "training/runs/gemma_v5_curriculum_df100_cond_hook_v1/stage1/adapters"
