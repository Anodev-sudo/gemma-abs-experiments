# Curriculum STAGE 2 — drill brief voice.
# Resumes the stage-1 grounding adapter and continues on the 894 briefs only.
# Short + lower LR: re-skin the voice without wiping the grounding (briefs last =
# they own final behavior). Pure continuation: same model, same prompt, same LoRA shape.
model: "quant_probe/stripped_base_df100_q4"
train: true
test: true
data: "gold_pipeline/05_milestone_assembly/gold_set/mlx_lora/title_abstract_chat_gemma_270m_it_abstract_to_feed_blurb_v5"

fine_tune_type: lora
num_layers: -1
lora_parameters:
  keys: ["self_attn.q_proj","self_attn.k_proj","self_attn.v_proj","self_attn.o_proj","mlp.gate_proj","mlp.up_proj","mlp.down_proj"]
  rank: 16
  scale: 10.0
  dropout: 0.05

# resume the stage-1 grounding adapter
resume_adapter_file: "training/runs/gemma_v5_curriculum_df100_q4qlora_v1/stage1/adapters/adapters.safetensors"

batch_size: 4
iters: 400
max_seq_length: 1024
mask_prompt: true
learning_rate: 5.0e-6          # half of stage 1: refine voice, don't wipe grounding
lr_schedule:
  name: cosine_decay
  warmup: 20
  warmup_init: 1.0e-7
  arguments: [5.0e-6, 400, 5.0e-7]
save_every: 50
steps_per_eval: 50
steps_per_report: 10
val_batches: -1
test_batches: -1
seed: 20260613
adapter_path: "training/runs/gemma_v5_curriculum_df100_q4qlora_v1/stage2/adapters"
