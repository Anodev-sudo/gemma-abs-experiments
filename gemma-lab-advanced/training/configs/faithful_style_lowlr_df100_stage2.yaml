# Curriculum STAGE 2 — LOW-LR style voice drill on top of faithful grounding.
# Identical to faithful_style_df100_stage2.yaml EXCEPT peak LR 5e-6 -> 1.5e-6 (~3.3x gentler).
# Tests whether a softer voice nudge perturbs the faithful base less while still shifting voice.
# Expectation (to be falsified): interpolates back toward faith_only, little/no hook gain.
model: "quant_probe/stripped_base_df100"
train: true
test: true
data: "training/data/curriculum_stage1_style_v1"

fine_tune_type: lora
num_layers: -1
lora_parameters:
  keys: ["self_attn.q_proj","self_attn.k_proj","self_attn.v_proj","self_attn.o_proj","mlp.gate_proj","mlp.up_proj","mlp.down_proj"]
  rank: 16
  scale: 10.0
  dropout: 0.05

resume_adapter_file: "training/runs/gemma_v5_curriculum_df100_faithful_v1/stage1/adapters/adapters.safetensors"

batch_size: 4
iters: 400
max_seq_length: 1024
mask_prompt: true
learning_rate: 1.5e-6
lr_schedule:
  name: cosine_decay
  warmup: 20
  warmup_init: 1.0e-7
  arguments: [1.5e-6, 400, 1.5e-7]
save_every: 50
steps_per_eval: 50
steps_per_report: 10
val_batches: -1
test_batches: -1
seed: 20260616
adapter_path: "training/runs/gemma_v5_curriculum_df100_faithful_style_lowlr_v1/stage2/adapters"
